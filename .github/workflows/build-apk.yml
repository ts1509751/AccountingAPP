name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 for Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Web Assets in Android Project
        run: |
          if [ ! -f android/app/src/main/assets/public/index.html ]; then
            echo "Error: index.html is missing in android/app/src/main/assets/public!"
            exit 1
          fi
          echo "Verified: android/app/src/main/assets/public/index.html exists."
          ls -la android/app/src/main/assets/public/

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Print Keystore SHA-1 Fingerprint
        run: |
          echo "## 🔑 Android Debug Keystore SHA-1" >> $GITHUB_STEP_SUMMARY
          echo "若要在 Android 手機上啟用 Google 帳號登入，請至 Firebase 專案設定 > 您的應用程式 > 新增 Android 應用程式，填入以下 SHA-1 憑證：" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "(SHA1|SHA256):" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
